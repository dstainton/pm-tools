# ============================================================================
#  pm-tools — Configuration
# ----------------------------------------------------------------------------
#  Fill in the placeholders marked <LIKE_THIS>. One config drives every command.
#  Keep this file private — it holds API tokens.
#
#  New here? Run `pm init` to copy this template to ~/.pm-tools/config.yaml, then edit
#  that copy. Tip: instead of pasting tokens, set them as environment variables
#  and reference them with ${ENV:VAR_NAME}. See the README.
#
#  config_version is the shape of this file. `pm update` raises it when a
#  newer pm-tools needs a new setting. Do not copy this file over a config
#  you have already filled in.
# ============================================================================

config_version: 6

# ----------------------------------------------------------------------------
#  1. The local model — Qwen3.8-27B Q3_K_M via llama.cpp
# ----------------------------------------------------------------------------
#  Prompts and these sampling values assume Qwen3.8 in instruct (non-thinking)
#  mode. Thinking is off: a Q3_K_M run that is allowed to think will spend its
#  token budget inside <think> and return empty or half-cut JSON.
#
#  Official Qwen instruct profile, with a cooler temperature so a 3-bit quant
#  stays on the schema. json_temperature is used by `pm refine`, `pm review`,
#  and `pm ready --deep`.
#  The small Qwen3-4B setup script uses the same alias, so swapping models does
#  not require a config change.
model:
  endpoint: "http://127.0.0.1:8080/v1/chat/completions"
  name: "qwen-local"
  temperature: 0.4
  json_temperature: 0.2
  top_p: 0.8
  top_k: 20
  presence_penalty: 1.5
  max_tokens: 2048
  timeout: 600
  # Whole-command budget, in seconds, across every model call in one run.
  # The per-call timeout above still applies to each request.
  total_timeout: 3600
  enable_thinking: false

# ----------------------------------------------------------------------------
#  2. Jira (Cloud)
# ----------------------------------------------------------------------------
jira:
  base_url: "https://<YOUR_ORG>.atlassian.net"
  email: "<YOUR_LOGIN_EMAIL>"
  api_token: "<YOUR_JIRA_API_TOKEN>"   # id.atlassian.com > Security > API tokens
  # The team project. Components on issues name products and workstreams.
  # A product does not need its own Jira project. A workstream only sets
  # `project:` if it lives outside this one.
  project: "APS"
  # Fields the light report fetch pulls. Usually no need to change this.
  fields: "summary,status,assignee,updated,duedate,priority,issuetype,labels"
  # Most issues pm will pull back for a single query, and how many per request.
  # Results are paged, so raising this only costs time.
  max_results: 500
  page_size: 100

  # -- Custom field IDs (used by `pm lint`, `pm review`, `pm ready`) -------
  #  These vary by Jira instance. Find them under Jira Settings > Issues >
  #  Custom fields, or via /rest/api/3/field. Leave a value blank ("") to skip
  #  that check. The defaults below are the most common Jira Cloud IDs.
  story_points_field: "customfield_10016"
  start_date_field: "customfield_10015"
  acceptance_criteria_field: ""        # only if you store AC in its own field
  # Jira Cloud now uses the Parent field for hierarchy in both team-managed and
  # company-managed projects. Keep "parent" unless your site still exposes a
  # legacy custom Epic Link field that you specifically need.
  epic_link_field: "parent"

# ----------------------------------------------------------------------------
#  2b. Comments — read by the commands that narrate a period
# ----------------------------------------------------------------------------
#  The whole thread is not kept. Each command uses the window it already
#  has, and only issues updated inside that window are asked:
#    pm report         since the last report; the first run uses report_days
#    pm brief          since that audience was last briefed; first run uses
#                      report_days
#    pm daily          the same --days window as movement
#    pm release-notes  on or after --since; with only --version, the newest
#                      max_per_issue comments
#    pm triage         still reads comments when this block is off, so a
#                      mention is not missed; the reply line quotes it
#  section_chars is how much comment text one report or release-notes
#  section may send to the model.
comments:
  enabled: true
  max_per_issue: 3
  max_issues: 25
  excerpt_chars: 240
  report_days: 7
  section_chars: 6000

# Pages (Confluence, and SharePoint when it is enabled). The window follows
# the command: since the last report, since you last briefed that audience,
# or an explicit --since / --sprint. Caps only. enabled: false skips both.
pages:
  enabled: true
  scope: space              # space: every changed page; labelled: only confluence_labels
  follow_jira_links: true
  max_pages: 20
  excerpt_chars: 2000
  section_chars: 8000
  summaries: true
  summary_chars: 6000
  max_summaries: 20
  match_epics_with_model: true

# ----------------------------------------------------------------------------
#  3. Confluence (Cloud)
# ----------------------------------------------------------------------------
confluence:
  base_url: "https://<YOUR_ORG>.atlassian.net/wiki"
  email: "<YOUR_LOGIN_EMAIL>"
  api_token: "<YOUR_CONFLUENCE_API_TOKEN>"   # same token as Jira usually works
  lookback_days: 7
  max_results: 50
  content_types: [page, blogpost]
  title_only_types: [database, embed]

# ----------------------------------------------------------------------------
#  4. SharePoint (via Microsoft Graph) — set enabled: false to skip
# ----------------------------------------------------------------------------
sharepoint:
  enabled: false
  tenant_id: "<YOUR_TENANT_ID>"
  client_id: "<YOUR_APP_CLIENT_ID>"
  client_secret: "<YOUR_APP_CLIENT_SECRET>"
  site_path: "sites/<YOUR_SITE>"
  lookback_days: 7
  max_results: 25

# ----------------------------------------------------------------------------
#  5. Lint rules (used by `pm lint` and `pm ready`) — tune to your standards
# ----------------------------------------------------------------------------
lint:
  # A ticket "In Progress" but untouched longer than this is flagged stale.
  stale_days: 14
  # Which fields must be present. Options: component, parent.
  # Component is intentionally NOT required on child work: workstream membership
  # is inherited from the parent's Component(s).
  required_fields: [parent]
  # Titles shorter than this many words are flagged. A longer title that
  # is merely unclear is a judgement for `pm review titles`, not a rule.
  min_title_words: 3
  # These flag only when they are the whole title ("test", "Refactor").
  vague_title_alone: [refactor, test]
  # Which issue types are treated as "stories" for AC / estimate checks.
  story_types: [story, bug]
  # Require acceptance criteria on story-type issues? The field being
  # filled counts, as does a description with an acceptance-criteria heading
  # or a Given/When/Then scenario. The word "when" on its own does not.
  # Quality is `pm review criteria`.
  require_acceptance_criteria: true
  # Require a story-point estimate on in-scope stories?
  require_estimate: true

# ----------------------------------------------------------------------------
#  5b. Review (used by `pm review`) — model-based judgement checks
# ----------------------------------------------------------------------------
review:
  # How many issues to send to the model per call. Qwen3.8 Q3_K_M keeps to
  # the JSON schema more reliably on small batches; 6-8 is the sweet spot.
  batch_size: 8

# ----------------------------------------------------------------------------
#  5c. Ready (used by `pm ready`) — the team's working agreement
# ----------------------------------------------------------------------------
#  Which criteria must be met before an item is pulled into a Sprint. Any
#  criterion listed here BLOCKS readiness; remove one to make it advisory-only.
#  This is a working agreement, not a Scrum rule.
#  Available: clear-title, has-acceptance-criteria, has-estimate,
#             linked-to-parent, has-component, sane-dates,
#             too-big-for-a-sprint
#  too-big-for-a-sprint is off unless you list it. It fails when story points
#  are above max_points. An item with no estimate does not also fail it.
#
#  Definition of Done is a printed checklist on `pm report` (the Increment
#  section) and a reminder on `pm ready`. A line may set `label:` and then
#  `pm ready` warns when a Done item lacks that label. Lines without a label
#  are reminders only. Leave the block commented out to print nothing.
# definition_of_done:
#   - "Acceptance criteria demonstrated"
#   - text: "Deployed to staging"
#     label: deployed-staging
ready:
  max_points: 8
  blocking_criteria:
    - clear-title
    - has-acceptance-criteria
    - has-estimate
    - linked-to-parent
    - sane-dates
    # has-component is left out on purpose — advisory only by default.
    # too-big-for-a-sprint is off unless you add it to this list.

# ----------------------------------------------------------------------------
#  5d. Daily Scrum (used by `pm daily`)
# ----------------------------------------------------------------------------
daily:
  # Default "moved since" window in days. Override at run time with --days.
  lookback_days: 1

# ----------------------------------------------------------------------------
#  5e. Membership — how pm decides which issues belong to a workstream
# ----------------------------------------------------------------------------
#  The Jira model this assumes:
#    * One project (jira.project) holds the work.
#    * Epics carry the Component(s) that name the workstream.
#    * Stories, Tasks, Bugs and Sub-tasks may carry a Component too, but often
#      do not — in which case their parent decides.
#
#  So an issue is in a workstream when EITHER it carries one of the
#  workstream's Components itself, OR it sits under something that does.
membership:
  # Issue type(s) that act as the workstream anchor.
  epic_types: [Epic]
  # Children with no Component of their own inherit their parent's workstream.
  inherit_from_parent: true
  # Set true if a child that names its own Component should be judged on that
  # alone, instead of also counting under its parent's workstream. Left false so
  # that mis-tagged work is visible somewhere rather than nowhere.
  child_component_wins: false
  # Safety valve for very large workstreams: how many directly tagged issues to
  # expand sub-tasks for in one query.
  max_parent_keys: 500

# ----------------------------------------------------------------------------
#  5f. Scopes — what each command looks at. No JQL required.
# ----------------------------------------------------------------------------
#  Each command narrows the workstream's membership with a handful of plain
#  options. pm turns these into the Jira query for you.
#
#  Options:
#    status              any | open | done | in-progress | todo
#    sprint              any | open | future | none
#    assignee            any | me | unassigned | assigned
#    types               list of issue type names to include
#    exclude_types       list of issue type names to leave out
#    labels_any          include only issues with one of these labels
#    labels_none         leave out issues with any of these labels
#    updated_within_days / created_within_days / due_within_days   whole days
#    extra_jql           escape hatch for a filter the options can't express
#
#  The values below are pm's defaults, spelled out so they are easy to change.
#  A single workstream can override any of them with its own `scopes:` block.
scopes:
  report:        {sprint: open}                 # in-sprint child work
  roadmap:       {status: open}                 # the workstream's epics
  lint:          {status: open}                 # epics + everything beneath
  review:        {status: open}
  ready:         {sprint: open, status: open}
  daily_moved:   {updated_within_days: 1}       # --days overrides this
  daily_wip:     {status: in-progress}

# ----------------------------------------------------------------------------
#  5g. Cache — Jira fetches (five minutes) and model replies (seven days)
# ----------------------------------------------------------------------------
#  Hits younger than ttl_seconds are reused. `pm ... --cached` uses a hit
#  even if it is stale (a plane / offline run). `pm ... --refresh` ignores
#  the cache. Relative paths are resolved from the folder you run pm in.
cache:
  enabled: true
  path: "~/.pm-tools/cache"
  ttl_seconds: 300
  # Model replies are kept much longer than Jira fetches. The key includes
  # the prompt, so an edited issue misses and is asked again. `pm warm`
  # fills this cache. --cached / --refresh apply to it too.
  model_ttl_seconds: 604800

# ----------------------------------------------------------------------------
#  5g2. Blocked — the statuses and labels that mean blocked in this workflow
# ----------------------------------------------------------------------------
#  Matched exactly, so a status named Unblocked does not count. `pm workstreams
#  check` warns when a status here is not a status on the project.
blocked:
  statuses: [Blocked]
  labels: [blocked]

# ----------------------------------------------------------------------------
#  5h. Today — the one command you type on a normal day
# ----------------------------------------------------------------------------
today:
  state_file: "~/.pm-tools/today.json"   # numbered actions for `pm do N`
  max_needs_you: 5
  max_moved: 8
  max_aging: 3
  untouched_days: 3                # in-sprint and quieter than this → NEEDS YOU

# ----------------------------------------------------------------------------
#  5i. Shared state — decisions and the inbox, so the PM and the BA see the
#      same queues. Cache, write-log and today.json stay local (~/.pm-tools).
# ----------------------------------------------------------------------------
#  Point shared_path at a synced OneDrive / SharePoint folder. Leave it
#  empty to keep everything in ~/.pm-tools.
state:
  shared_path: ""
  # local_path: "~/.pm-tools"            # override only if you must

# ----------------------------------------------------------------------------
#  5j. Triage — the "waiting on me" queue (`pm triage`)
# ----------------------------------------------------------------------------
triage:
  unassigned_in_sprint: true
  blocked: true                   # status, label, or a blocked-by link
  mentions_me_within_days: 3
  new_bugs_within_days: 1
  in_sprint_untouched_days: 3
  overdue: true

# ----------------------------------------------------------------------------
#  5k. Metrics — how many weeks `pm metrics` looks back
# ----------------------------------------------------------------------------
metrics:
  weeks: 8

# ----------------------------------------------------------------------------
#  5l. Publish — Confluence and/or Teams. Enable one, the other, or both.
#      `pm report --publish` and `pm publish FILE` use the write path
#      (preview, confirm, log). Nothing here runs on a schedule.
# ----------------------------------------------------------------------------
publish:
  confluence:
    enabled: false
    space: "APS"
    parent_page: "Weekly Reports"
  teams:
    enabled: false
    # Read only when enabled is true. An unset variable is fine while this
    # stays false, including the ${ENV:PM_TEAMS_WEBHOOK} line below.
    webhook: "${ENV:PM_TEAMS_WEBHOOK}"

# ----------------------------------------------------------------------------
#  6. Products — the portfolio layer, above workstreams
# ----------------------------------------------------------------------------
#  A Jira project is the team. Components represent products and workstreams.
#  A product is a name, an abbreviation, and optional defaults (scopes). Set
#  `project:` on a product only when it really lives outside jira.project.
#  `product_goal:` is one sentence. `pm report` and `pm brief` print it
#  under the product heading. Leave it off and the line is omitted.
#  A product may set its own `definition_of_done:` list; otherwise the
#  shared list above is used.
#  Workstreams stay a flat list and point at a product with `product: <abbrev>`.
#  A workstream with no product lands in Unassigned.
#
#  The product abbrev is what you pass to --product. Do not reuse a
#  workstream's abbrev as a product abbrev if you can help it — they live
#  in different flags, but identical short names are easy to mix up.
#
#    pm products
#    pm products add --name "Billing Platform" --abbrev BILL
#    pm products check          # verifies components in the team project
#    pm lint --product IP
# ----------------------------------------------------------------------------
products:

  - name: "Integration Platform"
    abbrev: "IP"

# ----------------------------------------------------------------------------
#  6b. Workstreams — reported and checked separately, in this order
# ----------------------------------------------------------------------------
#  A workstream needs only a name, an abbreviation, and the Jira Component(s)
#  that identify it. Everything else is optional.
#
#    name               how it appears in reports
#    abbrev             what you pass to --workstream
#    product            the product abbrev it belongs to (optional)
#    components         exact Jira Component name(s) — must match Jira
#    project            only if this stream lives outside the team project
#    confluence_space   space key holding its decisions / risks
#  A product may also set confluence_space. Those pages are matched to the
#  product's Epics and filed under the workstream that owns the Epic.
#    confluence_labels  which labels to gather from that space
#    sharepoint_query   search term for its documents
#    scopes             per-workstream overrides of the section above
#
#  Add or remove one without hand-editing this file:
#    pm workstreams add --name "Billing Platform" --abbrev BIL \
#                       --components "Billing Platform" --product IP
#    pm workstreams remove BIL
#
#  Then confirm Jira agrees with what you typed:
#    pm workstreams check --show-jql
#
#  Target a single stream on any command with:  --workstream SDX
#  Target a whole product with:                 --product IP
# ----------------------------------------------------------------------------
workstreams:

  - name: "Secure Data Exchange"
    abbrev: "SDX"
    product: "IP"
    components: ["Secure Data Exchange"]
    confluence_space: "SDX"
    confluence_labels: [decision, risk, dependency]
    sharepoint_query: "SDX"

  - name: "API Platform"
    abbrev: "APS"
    product: "IP"
    components: ["API Platform"]
    confluence_space: "APS"
    confluence_labels: [decision, risk, dependency]
    sharepoint_query: "API Platform"

  - name: "Integration Toolkit"
    abbrev: "ITK"
    product: "IP"
    components: ["Integration Toolkit"]
    confluence_space: "ITK"
    confluence_labels: [decision, risk, dependency]
    sharepoint_query: "Integration Toolkit"

# ----------------------------------------------------------------------------
#  5m. Prompts, queries and conventions
# ----------------------------------------------------------------------------
#  The words sent to the model, and the JQL and CQL sent to Jira and
#  Confluence, have named defaults in the code. Override one here when your
#  Jira is set up differently. `pm doctor --prompts` and `pm doctor --queries`
#  show the effective text. See docs/CUSTOMISING.md for every default.
#
#  prompts:
#    report.section:
#      append: |
#        8. Name a Jira Component only if the Material names it.
#    # values.headings renames a section. The seven roles stay put.
#    # refine.titles:
#    #   file: prompts/refine-titles.txt
#    #   based_on: 1
#  queries:
#    # status.review: {text: 'status = "In Review"'}
#    # membership.inherit.epic: {text: '"Epic Link" IN ({epic_keys})'}
#  conventions:
#    # bug_types: [Bug]
#    # blocked_by_links: ["is blocked by", "blocked by"]
#    # blocks_links: [blocks]
#    # note_issuetypes: [Story, Task, Bug]
#    # note_issuetype: Story
#    # action_issuetypes: [Story, Task]
#    # action_issuetype: Task
#    # risk_label: risk
#  Prompt ids:
#    report.section — weekly workstream section
#    report.section_tail — last line of that user message
#    brief.debrief — decisions and actions from meeting notes
#    inbox.file_note — where a captured note belongs
#    refine.titles — clearer titles
#    refine.criteria — acceptance criteria
#    refine.tail — last line of a refine user message
#    review.titles — why a title is unclear
#    review.criteria — what acceptance criteria are missing
#    review.titles_tail — last line of the titles user message
#    review.criteria_tail — last line of the criteria user message
#    release_notes.prose — done work turned into prose
#    release_notes.partner_rules — extra rules for a partner release note
#    pages.summary — one sentence for a changed page
#    pages.epic_match — which Epic a page belongs to
#    pages.tail — last line of a page prompt
#    report.leadership — portfolio summary for leadership
#    report.partner — external progress update
#  Query ids:
#    status.open status.done status.in-progress status.todo
#    sprint.open sprint.future sprint.none sprint.by_id
#    assignee.me assignee.unassigned assignee.assigned
#    membership.anchor.component membership.anchor.label membership.anchor.field
#    membership.epics membership.tagged
#    membership.inherit.epic membership.inherit.parent
#    membership.own_empty.component membership.own_empty.field
#    coverage.open_in_project doctor.membership_open
#    release_notes.done release_notes.since release_notes.version
#    today.in_sprint_open
#    confluence.space confluence.labels confluence.types confluence.window
#    brief.risk_pages
#    epics.children epics.resolved
#    registers.descendants registers.children

# Who a narrative report is for. pm keeps today's file names.
audiences:
  default: pm
  warm: [pm]
  pm:
    name: "Product management"
  leadership:
    name: "Leadership"
    at_risk_due_days: 14
    max_docs_per_product: 5
  partner:
    name: "Partners"
    epic_labels: [partner-visible]
    page_labels: [partner-visible]
    exclude_labels: [internal]
    include_jira_links: false
    include_confluence_links: false
    show_target_dates: false

# ----------------------------------------------------------------------------
#  7. Output (used by `pm report`)
# ----------------------------------------------------------------------------
output:
  directory: "~/.pm-tools/out"
  file: "weekly_report_{date}.md"
  audience: "stakeholders"
  # Remembers last week's items so the report can show what changed.
  # Resolved under directory. Created after the first run; keep it between runs.
  state_file: "report_state.json"
