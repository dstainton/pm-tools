# ============================================================================
#  Product Manager Helper (pm) — Configuration
# ----------------------------------------------------------------------------
#  Fill in the placeholders marked <LIKE_THIS>. One config drives every command
#  (pm report, pm lint, pm review, pm ready). Keep this file private — it holds
#  API tokens.
#
#  New here? Run `pm init` to copy this template to ~/.pm/config.yaml, then edit
#  that copy. Tip: instead of pasting tokens, set them as environment variables
#  and reference them with ${ENV:VAR_NAME}. See the README.
# ============================================================================

# ----------------------------------------------------------------------------
#  1. The local model (llama.cpp or another OpenAI-compatible server)
# ----------------------------------------------------------------------------
#  The bundled Windows setup scripts expose both the small test model and the
#  larger Qwen model using the same alias, so pm does not need to change when
#  you swap models.
model:
  endpoint: "http://127.0.0.1:8080/v1/chat/completions"
  name: "qwen-local"
  temperature: 0.2
  max_tokens: 4000
  timeout: 600

# ----------------------------------------------------------------------------
#  2. Jira (Cloud)
# ----------------------------------------------------------------------------
jira:
  base_url: "https://<YOUR_ORG>.atlassian.net"
  email: "<YOUR_LOGIN_EMAIL>"
  api_token: "<YOUR_JIRA_API_TOKEN>"   # id.atlassian.com > Security > API tokens
  # The project holding the work. Every workstream uses this unless it sets its
  # own `project:`. One place to change if the backlog moves.
  project: "APS"
  # Fields the light report fetch pulls. Usually no need to change this.
  fields: "summary,status,assignee,updated,duedate,priority,issuetype,labels"
  # Most issues pm will pull back for a single query, and how many per request.
  # Results are paged, so raising this only costs time.
  max_results: 500
  page_size: 100

  # -- Custom field IDs (used by `pm lint`, `pm review`, `pm ready`) -------
  #  These vary by Jira instance. Find them under Jira Settings > Issues >
  #  Custom fields, or via /rest/api/3/field. Leave a value blank ("") to skip
  #  that check. The defaults below are the most common Jira Cloud IDs.
  story_points_field: "customfield_10016"
  start_date_field: "customfield_10015"
  acceptance_criteria_field: ""        # only if you store AC in its own field
  # Jira Cloud now uses the Parent field for hierarchy in both team-managed and
  # company-managed projects. Keep "parent" unless your site still exposes a
  # legacy custom Epic Link field that you specifically need.
  epic_link_field: "parent"

# ----------------------------------------------------------------------------
#  3. Confluence (Cloud)
# ----------------------------------------------------------------------------
confluence:
  base_url: "https://<YOUR_ORG>.atlassian.net/wiki"
  email: "<YOUR_LOGIN_EMAIL>"
  api_token: "<YOUR_CONFLUENCE_API_TOKEN>"   # same token as Jira usually works
  lookback_days: 7
  max_results: 50

# ----------------------------------------------------------------------------
#  4. SharePoint (via Microsoft Graph) — set enabled: false to skip
# ----------------------------------------------------------------------------
sharepoint:
  enabled: false
  tenant_id: "<YOUR_TENANT_ID>"
  client_id: "<YOUR_APP_CLIENT_ID>"
  client_secret: "<YOUR_APP_CLIENT_SECRET>"
  site_path: "sites/<YOUR_SITE>"
  lookback_days: 7
  max_results: 25

# ----------------------------------------------------------------------------
#  5. Lint rules (used by `pm lint` and `pm ready`) — tune to your standards
# ----------------------------------------------------------------------------
lint:
  # A ticket "In Progress" but untouched longer than this is flagged stale.
  stale_days: 14
  # Which fields must be present. Options: component, epic.
  # Component is intentionally NOT required on child work: workstream membership
  # is inherited from the Epic's Component(s).
  required_fields: [epic]
  # Titles shorter than this many words are flagged for review.
  min_title_words: 3
  # Titles containing any of these words are flagged as vague.
  vague_title_terms: [fix, update, change, stuff, misc, tbd, wip, test,
                      various, temp, placeholder, todo, refactor]
  # Which issue types are treated as "stories" for AC / estimate checks.
  story_types: [story, bug]
  # Require acceptance criteria on story-type issues?
  require_acceptance_criteria: true
  # Any of these phrases counts as "has acceptance criteria".
  acceptance_criteria_markers: ["acceptance criteria", "given ", "when ",
                                "then ", "ac:"]
  # Require a story-point estimate on in-scope stories?
  require_estimate: true

# ----------------------------------------------------------------------------
#  5b. Review (used by `pm review`) — model-based judgement checks
# ----------------------------------------------------------------------------
review:
  # How many issues to send to the model per call. Smaller = more reliable on
  # a modest laptop; larger = fewer calls. 10-15 is a good balance.
  batch_size: 15

# ----------------------------------------------------------------------------
#  5c. Ready (used by `pm ready`) — the Definition of Ready gate
# ----------------------------------------------------------------------------
#  Which criteria must be met for a ticket to count as "Ready". Any criterion
#  listed here BLOCKS readiness; remove one to make it advisory-only.
#  Available: clear-title, has-acceptance-criteria, has-estimate,
#             linked-to-epic, has-component, sane-dates
ready:
  blocking_criteria:
    - clear-title
    - has-acceptance-criteria
    - has-estimate
    - linked-to-epic
    - sane-dates
    # has-component is left out on purpose — advisory only by default.

# ----------------------------------------------------------------------------
#  5d. Standup (used by `pm standup`) — daily movement snapshot
# ----------------------------------------------------------------------------
standup:
  # Default "moved since" window in days. Override at run time with --days.
  lookback_days: 1

# ----------------------------------------------------------------------------
#  5e. Membership — how pm decides which issues belong to a workstream
# ----------------------------------------------------------------------------
#  The Jira model this assumes:
#    * One project (jira.project) holds the work.
#    * Epics carry the Component(s) that name the workstream.
#    * Stories, Tasks, Bugs and Sub-tasks may carry a Component too, but often
#      do not — in which case their parent decides.
#
#  So an issue is in a workstream when EITHER it carries one of the
#  workstream's Components itself, OR it sits under something that does.
membership:
  # Issue type(s) that act as the workstream anchor.
  epic_types: [Epic]
  # Children with no Component of their own inherit their parent's workstream.
  inherit_from_parent: true
  # Set true if a child that names its own Component should be judged on that
  # alone, instead of also counting under its parent's workstream. Left false so
  # that mis-tagged work is visible somewhere rather than nowhere.
  child_component_wins: false
  # Safety valve for very large workstreams: how many directly tagged issues to
  # expand sub-tasks for in one query.
  max_parent_keys: 500

# ----------------------------------------------------------------------------
#  5f. Scopes — what each command looks at. No JQL required.
# ----------------------------------------------------------------------------
#  Each command narrows the workstream's membership with a handful of plain
#  options. pm turns these into the Jira query for you.
#
#  Options:
#    status              any | open | done | in-progress | todo
#    sprint              any | open | future | none
#    assignee            any | me | unassigned | assigned
#    types               list of issue type names to include
#    exclude_types       list of issue type names to leave out
#    labels_any          include only issues with one of these labels
#    labels_none         leave out issues with any of these labels
#    updated_within_days / created_within_days / due_within_days   whole days
#    extra_jql           escape hatch for a filter the options can't express
#
#  The values below are pm's defaults, spelled out so they are easy to change.
#  A single workstream can override any of them with its own `scopes:` block.
scopes:
  report:        {sprint: open}                 # in-sprint child work
  roadmap:       {status: open}                 # the workstream's epics
  lint:          {status: open}                 # epics + everything beneath
  review:        {status: open}
  ready:         {sprint: open, status: open}
  standup_moved: {updated_within_days: 1}       # --days overrides this
  standup_wip:   {status: in-progress}

# ----------------------------------------------------------------------------
#  6. Workstreams — reported and checked separately, in this order
# ----------------------------------------------------------------------------
#  A workstream needs only a name, an abbreviation, and the Jira Component(s)
#  that identify it. Everything else is optional.
#
#    name               how it appears in reports
#    abbrev             what you pass to --workstream
#    components         exact Jira Component name(s) — must match Jira
#    project            only if this stream lives outside jira.project
#    confluence_space   space key holding its decisions / risks
#    confluence_labels  which labels to gather from that space
#    sharepoint_query   search term for its documents
#    scopes             per-workstream overrides of the section above
#
#  Add or remove one without hand-editing this file:
#    pm workstreams add --name "Billing Platform" --abbrev BIL \
#                       --components "Billing Platform"
#    pm workstreams remove BIL
#
#  Then confirm Jira agrees with what you typed:
#    pm workstreams check --show-jql
#
#  Target a single stream on any command with:  --workstream SDX
# ----------------------------------------------------------------------------
workstreams:

  - name: "Secure Data Exchange"
    abbrev: "SDX"
    components: ["Secure Data Exchange"]
    confluence_space: "SDX"
    confluence_labels: [decision, risk, dependency]
    sharepoint_query: "SDX"

  - name: "API Platform"
    abbrev: "APS"
    components: ["API Platform"]
    confluence_space: "APS"
    confluence_labels: [decision, risk, dependency]
    sharepoint_query: "API Platform"

  - name: "Integration Toolkit"
    abbrev: "ITK"
    components: ["Integration Toolkit"]
    confluence_space: "ITK"
    confluence_labels: [decision, risk, dependency]
    sharepoint_query: "Integration Toolkit"

# ----------------------------------------------------------------------------
#  7. Output (used by `pm report`)
# ----------------------------------------------------------------------------
output:
  file: "weekly_report_{date}.md"
  audience: "directors"
  # Remembers last week's items so the report can show what changed.
  # Created automatically after the first run; keep it between runs.
  state_file: "report_state.json"
