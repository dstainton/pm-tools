# ============================================================================
#  Packaging for pm-tools.
#
#  This is what turns `python pm.py lint` into `pm lint` (and `pm-tools lint`).
#
#  First install (no clone):
#      pipx install git+https://github.com/dstainton/pm-tools.git
#      pm init
#
#  Development, from a clone:
#      pip install -e .
#
#  The -e means "editable": pip links to these files in place. `pm update`
#  will not git-pull an editable checkout; you pull it yourself.
#
#  Uninstall: pipx uninstall pm-tools
#  (an older checkout may still be named pm-helper: pip uninstall pm-helper)
# ============================================================================

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-tools"
version = "0.7.0"
description = "pm-tools — products, today, triage, refine, inbox, metrics, brief, publish, doctor, workstreams, report, lint, ready, daily"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "pyyaml",
]

[project.scripts]
pm = "pm:main"
pm-tools = "pm:main"

[tool.setuptools]
py-modules = ["pm"]
packages = ["core", "commands"]

[tool.setuptools.package-data]
"*" = ["config.yaml"]

[tool.setuptools.data-files]
"share/pm-tools" = ["config.yaml"]
